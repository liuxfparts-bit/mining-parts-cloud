# ========== 矿配云 Docker 部署 ==========
# 使用：docker compose up -d
# 包含：Next.js 应用 + PostgreSQL 16

services:
  # ---- PostgreSQL 数据库 ----
  postgres:
    image: postgres:16-alpine
    container_name: mining-parts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mining
      POSTGRES_PASSWORD: mining_cloud_2026
      POSTGRES_DB: mining_parts_cloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mining -d mining_parts_cloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Next.js 应用 ----
  app:
    build: .
    container_name: mining-parts-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://mining:mining_cloud_2026@postgres:5432/mining_parts_cloud?schema=public"
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads

volumes:
  pgdata:
  uploads:
