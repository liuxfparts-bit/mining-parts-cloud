name: KuangPeiYun CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kuangpeiyun-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, migration and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: kuangpeiyun_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d kuangpeiyun_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/kuangpeiyun_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-not-for-production
      NEXT_PUBLIC_SITE_MODE: normal
      STORAGE_DRIVER: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Guard retired PartNumber field
        run: ./scripts/ci/legacy-partnumber-guard.sh

      - name: Migration gate - rebuild empty database
        run: npx prisma migrate deploy

      - name: Verify migration state
        run: npx prisma migrate status

      - name: Asset Gate regression tests
        run: npm run test:asset-gate-v1

      - name: Evidence Foundation isolated DB tests
        env:
          EVIDENCE_TEST_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/kuangpeiyun_ci
        run: npm run test:evidence-foundation

      - name: Database role isolation tests (disposable CI only)
        run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; fi
          PGPASSWORD=ci_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_user -d kuangpeiyun_ci -f scripts/test-db-role-boundary.sql

      - name: Database role compatibility tests
        run: PGPASSWORD=ci_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_user -d kuangpeiyun_ci -f scripts/test-db-role-compatibility.sql

      - name: Separate Prisma migrator deployment (disposable CI only)
        run: bash scripts/ci/test-separated-prisma-migrator.sh

      - name: Production build
        run: npm run build

      - name: Runtime app HTTP smoke (separate restricted CI role)
        run: bash scripts/ci/test-runtime-app-smoke.sh
