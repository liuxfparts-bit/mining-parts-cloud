name: KuangPeiYun CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kuangpeiyun-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, migration and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: kuangpeiyun_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d kuangpeiyun_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/kuangpeiyun_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-not-for-production
      NEXT_PUBLIC_SITE_MODE: normal
      STORAGE_DRIVER: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Guard retired PartNumber field
        run: ./scripts/ci/legacy-partnumber-guard.sh

      - name: Migration gate - rebuild empty database
        run: npx prisma migrate deploy

      - name: Verify migration state
        run: npx prisma migrate status

      - name: Production build
        run: npm run build
